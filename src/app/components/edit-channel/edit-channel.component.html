<div class="main-container" [hidden]="editChannelisOpen">
  <header>
    <span># Entwicklerteam </span>
    <img src="/assets/img/close.svg" alt="Close Button" />
  </header>

  <form [formGroup]="editChannelName" (ngSubmit)="onSubmit('editName')">
    <div class="transform-container" [class.active]="isInputActive">
      <div>
        <span>Channel-Name </span>
        <button
          class="transform-trigger"
          (click)="toggleInput()"
          [class.active]="isInputActive"
          type="submit"
        >
          @if (isInputActive) {
          <img [src]="currentCheckImageUrl" (click)="toggleImage()" />
          } @else {
          <img [src]="currentEditImageUrl" (click)="showEditClickedImage()" />
          }
        </button>
      </div>

      @if (!isInputActive) {
      <span class="channel-name"> # {{ selectedChannel?.name }} </span>
      } @if (isInputActive) {
      <input
        #inputField
        id="channelName"
        formControlName="name"
        [(ngModel)]="textContent"
        (blur)="onBlur()"
        type="text"
        class="transform-input outline-none"
      />
      }
    </div>
  </form>
  <form
    [formGroup]="editChannelDescription"
    (ngSubmit)="onSubmit('editDescription')"
  >
    <div class="transform-container" [class.active]="isInputActive">
      <div>
        <span>Beschreibung</span>
        <button
          class="transform-trigger"
          (click)="toggleInput()"
          [class.active]="isInputActive"
          type="submit"
        >
          @if (isInputActive) {
          <img [src]="currentCheckImageUrl" (click)="toggleImage()" />
          } @else {
          <img [src]="currentEditImageUrl" (click)="showEditClickedImage()" />
          }
        </button>
      </div>

      @if (!isInputActive) {
      <span class="content">
        {{ textContent || "Click to edit" }}
      </span>
      } @if (isInputActive) {
      <textarea
        #inputField
        id="channelDescription"
        formControlName="description"
        [value]="textContent"
        [attr.rows]="calculateRows()"
        [(ngModel)]="textContent"
        (input)="updateContent($event); onInput()"
        (blur)="onBlur()"
        type="text"
        class="transform-input outline-none"
      ></textarea>
      }
      <div class="line"></div>
      <div class="creator-box">
        <span>Erstellt von</span>
        <span class="creator">Noah Braun</span>
      </div>
    </div>
  </form>



  <div>
    <span>Mitglieder</span>
    <div>
      <img src="" alt="Member-Avatar" />
      <span>Max Musterman</span>
    </div>
    <div class="btn">
      <img src="" />
      <span>Mitglieder hinzufügen</span>
    </div>
  </div>

  <button>Channel verlassen</button>
</div>

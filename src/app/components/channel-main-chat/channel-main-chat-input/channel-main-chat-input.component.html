<div class="message-container">
  <form [formGroup]="chatInputForm" (ngSubmit)="onSubmit()">
    <div>
      <input
        type="text"
        placeholder="Nachricht an Member"
        formControlName="message"
      />
      <span class="underline"></span>
    </div>
    <div class="icons-container">
      <div class="icons">
        <button class="plus-icon-btn">
          <img [src]="imagePaths.ADD_FILE" alt="Add File Button" class="plus-icon" />
        </button>
        <div><img [src]="imagePaths.HORIZONTAL_LINE"/></div>
        <!-- <button>
          <img src="assets/img/sentiment_satisfied.png" alt="" class="smiley" />
        </button> -->
        <button type="button">
          <img [src]="imagePaths.ADD_EMOJI"  alt="Add Emoji Button" class="smiley" />
        </button>
        <button>
          <img [src]="imagePaths.ADD_PERSON_LINK" alt="Link Person Button" class="hash-email" />
        </button>
      </div>
      <div class="send-btn">
        <button type="submit" [disabled]="chatInputForm.invalid">
          <img [src]="imagePaths.SEND_MESSAGE" alt="Send Message Button" class="send-img" />
        </button>
      </div>
    </div>
  </form>
</div>
